<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Painel Metas & Repic</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #202124;
    }
    
    /* TOPO E FILTROS */
    .top-bar {
      display: flex;
      gap: 16px;
      align-items: center;
      background: #fff;
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .top-bar h1 {
      font-size: 20px;
      margin: 0;
      margin-right: auto;
      color: #1a73e8;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field-group label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #5f6368;
    }
    input, select {
      padding: 8px 12px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    input:focus, select:focus { border-color: #1a73e8; }
    .btn-clear {
      padding: 8px 14px;
      background: #f1f3f4;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      color: #3c4043;
      align-self: flex-end;
    }
    .btn-clear:hover { background: #e8eaed; }

    /* DASHBOARD LAYOUT GRID */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 20px;
    }
    @media (max-width: 1024px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    /* CARD DO GRÁFICO PRINCIPAL */
    .chart-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
    }
    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .chart-header h2 { font-size: 16px; margin: 0; }
    .chart-container {
      position: relative;
      flex-grow: 1;
      min-height: 380px;
    }

    /* PAINEL LATERAL */
    .side-panel {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      max-height: 600px;
    }
    .side-header {
      border-bottom: 1px solid #f1f3f4;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .side-header h3 { margin: 0; font-size: 16px; color: #1a73e8; }
    .side-content {
      overflow-y: auto;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-right: 4px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .badge-comprou { color: #137333; }
    .badge-previsto { color: #1a73e8; }
    .badge-atrasado { color: #c5221f; }

    .client-item {
      padding: 10px;
      border-radius: 8px;
      background: #f8f9fa;
      border: 1px solid #f1f3f4;
      cursor: pointer;
      margin-bottom: 6px;
      transition: background 0.15s, border-color 0.15s;
    }
    .client-item:hover {
      background: #e8f0fe;
      border-color: #d2e3fc;
    }
    .client-item .name { font-weight: 600; font-size: 13px; color: #202124; margin-bottom: 4px; }
    .client-item .sub { font-size: 11px; color: #5f6368; display: flex; justify-content: space-between; }

    /* MODAL POPUP DE HISTÓRICO */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal-card {
      background: #fff;
      border-radius: 12px;
      width: 90%;
      max-width: 600px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px;
      background: #1a73e8;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 { margin: 0; font-size: 16px; }
    .modal-close {
      background: none; border: none; color: #fff; font-size: 20px; cursor: pointer;
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
    }
    .stat-box { font-size: 12px; }
    .stat-box span { color: #5f6368; display: block; }
    .stat-box b { font-size: 14px; color: #202124; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 8px 10px; font-size: 12px; text-align: left; border-bottom: 1px solid #f1f3f4; }
    th { background: #f8f9fa; color: #5f6368; }
  </style>
</head>
<body>

  <!-- BARRA DE FILTROS SUPERIOR -->
  <div class="top-bar">
    <h1>📊 Previsão & Metas Mensais</h1>

    <div class="field-group">
      <label for="busca-cliente">Pesquisar Cliente:</label>
      <input type="text" id="busca-cliente" list="lista-clientes" placeholder="Nome ou código..." onchange="aoSelecionarCliente()">
      <datalist id="lista-clientes"></datalist>
    </div>

    <div class="field-group">
      <label for="seletor-rep">Representante:</label>
      <select id="seletor-rep" onchange="carregarGraficoMain()">
        <option value="TODOS">Todos os Representantes</option>
      </select>
    </div>

    <button class="btn-clear" onclick="limparFiltros()">Limpar Filtros</button>
  </div>

  <!-- CONTEÚDO PRINCIPAL (GRÁFICO + PAINEL LATERAL) -->
  <div class="main-grid">
    
    <!-- GRÁFICO PRINCIPAL -->
    <div class="chart-card">
      <div class="chart-header">
        <h2 id="titulo-grafico">Desempenho Geral por Mês</h2>
        <span style="font-size: 12px; color: #5f6368;">Clique em uma barra para detalhar</span>
      </div>
      <div class="chart-container">
        <canvas id="grafico-principal"></canvas>
      </div>
    </div>

    <!-- PAINEL LATERAL DETALHADO -->
    <div class="side-panel">
      <div class="side-header">
        <h3 id="titulo-side">Selecione um mês no gráfico</h3>
      </div>
      <div class="side-content" id="conteudo-side">
        <p style="color: #5f6368; font-size: 13px; text-align: center; margin-top: 40px;">
          Clique em qualquer barra do mês para ver quem comprou, quem deveria comprar e quem está em atraso acumulado.
        </p>
      </div>
    </div>

  </div>

  <!-- POPUP MODAL DO CLIENTE -->
  <div class="modal-overlay" id="modal-cliente">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-nome-cliente">Detalhes do Cliente</h3>
        <button class="modal-close" onclick="fecharModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-conteudo">
        Carregando histórico...
      </div>
    </div>
  </div>

  <script>
    var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxPbgM13xDJuKIgsQnpsWbFhISalS6lp_Bs3IEmLIP_Qn-Fxqp9xSA2SSaHzUF71NPNtw/exec";
    var MESES = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
    
    var chartInstance = null;
    var clienteSelecionadoCod = null;

    function fmtMoeda(v) {
      return "R$ " + Number(v || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function chamarApi(action, params) {
      var url = APPS_SCRIPT_URL + '?action=' + action;
      Object.keys(params || {}).forEach(function(k) {
        if (params[k]) url += '&' + k + '=' + encodeURIComponent(params[k]);
      });
      return fetch(url).then(function(res) { return res.json(); });
    }

    // Inicialização
    window.onload = function() {
      carregarRepsEClientes();
      carregarGraficoMain();
    };

    function carregarRepsEClientes() {
      chamarApi('listaReps').then(function(reps) {
        var sel = document.getElementById('seletor-rep');
        sel.innerHTML = '<option value="TODOS">Todos os Representantes</option>';
        reps.forEach(function(r) {
          var opt = document.createElement('option');
          opt.value = r.cod;
          opt.textContent = r.cod + ' - ' + r.nome;
          sel.appendChild(opt);
        });
      });

      chamarApi('listaClientes').then(function(clientes) {
        var dl = document.getElementById('lista-clientes');
        dl.innerHTML = '';
        clientes.forEach(function(c) {
          var opt = document.createElement('option');
          opt.value = c.cod + " - " + c.nome;
          dl.appendChild(opt);
        });
      });
    }

    function aoSelecionarCliente() {
      var val = document.getElementById('busca-cliente').value;
      if (val && val.includes(" - ")) {
        clienteSelecionadoCod = val.split(" - ")[0];
        document.getElementById('titulo-grafico').textContent = "Histórico & Previsão: " + val.split(" - ")[1];
      } else {
        clienteSelecionadoCod = null;
        document.getElementById('titulo-grafico').textContent = "Desempenho Geral por Mês";
      }
      carregarGraficoMain();
    }

    function limparFiltros() {
      document.getElementById('busca-cliente').value = "";
      document.getElementById('seletor-rep').value = "TODOS";
      clienteSelecionadoCod = null;
      document.getElementById('titulo-grafico').textContent = "Desempenho Geral por Mês";
      carregarGraficoMain();
    }

    // Carrega o gráfico principal mês a mês
    function carregarGraficoMain() {
      var rep = document.getElementById('seletor-rep').value;
      
      chamarApi('graficoMensal', { rep: rep, cod: clienteSelecionadoCod }).then(function(dados) {
        var ctx = document.getElementById('grafico-principal').getContext('2d');
        
        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: MESES,
            datasets: [
              {
                label: 'Realizado (R$)',
                data: dados.map(function(d){ return d.realizado; }),
                backgroundColor: '#1e8e3e'
              },
              {
                label: 'Meta / Projeção (R$)',
                data: dados.map(function(d){ return d.meta; }),
                backgroundColor: '#1a73e8'
              },
              {
                label: 'Atrasos Acumulados (R$)',
                data: dados.map(function(d){ return d.atrasadoCarregado; }),
                backgroundColor: '#d93025'
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            onClick: function(e, elements) {
              if (elements.length > 0) {
                var index = elements[0].index;
                carregarDetalhesMes(index + 1);
              }
            },
            scales: {
              y: { beginAtZero: true, ticks: { callback: function(v){ return fmtMoeda(v); } } }
            }
          }
        });
      });
    }

    // Carrega o painel lateral ao clicar no mês
    function carregarDetalhesMes(mesNum) {
      var rep = document.getElementById('seletor-rep').value;
      document.getElementById('titulo-side').textContent = "Mês: " + MESES[mesNum - 1];
      document.getElementById('conteudo-side').innerHTML = "<p style='color:#666'>Carregando detalhes...</p>";

      chamarApi('detalheMes', { mes: mesNum, rep: rep, cod: clienteSelecionadoCod }).then(function(res) {
        var html = "";

        // Section: Comprou
        html += '<div><div class="section-title badge-comprou"><span>🟢 Comprou no Mês</span><span>' + res.comprou.length + '</span></div>';
        if (res.comprou.length === 0) html += '<p style="font-size:12px; color:#999;">Nenhuma compra realizada.</p>';
        res.comprou.forEach(function(c) {
          html += '<div class="client-item" onclick="abrirModal(\'' + c.cod_cliente + '\')">' +
            '<div class="name">' + c.nome + '</div>' +
            '<div class="sub"><span>Vendido: ' + fmtMoeda(c.valor) + '</span><span>Rep: ' + c.rep + '</span></div>' +
            '</div>';
        });
        html += '</div>';

        // Section: Deveria Comprar
        html += '<div><div class="section-title badge-previsto"><span>🔵 Previsto no Mês</span><span>' + res.deveriaComprar.length + '</span></div>';
        if (res.deveriaComprar.length === 0) html += '<p style="font-size:12px; color:#999;">Sem previsões diretas.</p>';
        res.deveriaComprar.forEach(function(c) {
          html += '<div class="client-item" onclick="abrirModal(\'' + c.cod_cliente + '\')">' +
            '<div class="name">' + c.nome + '</div>' +
            '<div class="sub"><span>Previsto: ' + c.dataPrevista + '</span><span>' + fmtMoeda(c.valorEsperado) + '</span></div>' +
            '</div>';
        });
        html += '</div>';

        // Section: Atrasados Acumulados
        html += '<div><div class="section-title badge-atrasado"><span>🔴 Atrasados Acumulados</span><span>' + res.atrasados.length + '</span></div>';
        if (res.atrasados.length === 0) html += '<p style="font-size:12px; color:#999;">Nenhum atraso pendente.</p>';
        res.atrasados.forEach(function(c) {
          html += '<div class="client-item" style="border-left: 4px solid #d93025;" onclick="abrirModal(\'' + c.cod_cliente + '\')">' +
            '<div class="name">' + c.nome + '</div>' +
            '<div class="sub"><span style="color:#c5221f;">Original: ' + c.dataOriginal + '</span><span>' + fmtMoeda(c.valorEsperado) + '</span></div>' +
            '</div>';
        });
        html += '</div>';

        document.getElementById('conteudo-side').innerHTML = html;
      });
    }

    // Modal de Histórico do Cliente
    function abrirModal(codCliente) {
      document.getElementById('modal-cliente').style.display = 'flex';
      document.getElementById('modal-conteudo').innerHTML = "Carregando histórico do cliente...";

      chamarApi('detalheCliente', { cod: codCliente }).then(function(res) {
        var r = res.repic;
        document.getElementById('modal-nome-cliente').textContent = r ? r.nome : "Cliente " + codCliente;

        var html = '<div class="stats-grid">' +
          '<div class="stat-box"><span>Representante</span><b>' + (r ? r.rep : '—') + '</b></div>' +
          '<div class="stat-box"><span>Repic Médio</span><b>' + (r && r.repicMedio ? r.repicMedio + ' dias' : '—') + '</b></div>' +
          '<div class="stat-box"><span>Ticket Médio</span><b>' + (r ? fmtMoeda(r.ticketMedio) : '—') + '</b></div>' +
          '<div class="stat-box"><span>Total Comprado</span><b>' + fmtMoeda(res.totalGeral) + '</b></div>' +
          '<div class="stat-box"><span>Última Compra</span><b>' + (r ? r.ultimaCompra : '—') + '</b></div>' +
          '<div class="stat-box"><span>Próxima Prevista</span><b>' + (r && r.proximaCompra ? r.proximaCompra : '—') + '</b></div>' +
          '</div>';

        html += '<h4 style="margin: 12px 0 6px 0; font-size: 13px;">Histórico de Pedidos</h4>';
        html += '<table><thead><tr><th>Pedido</th><th>Data</th><th>Rep</th><th>Valor</th></tr></thead><tbody>';
        
        res.historico.forEach(function(p) {
          html += '<tr><td>' + p.num + '</td><td>' + p.data + '</td><td>' + p.rep + '</td><td>' + fmtMoeda(p.valor) + '</td></tr>';
        });
        
        html += '</tbody></table>';
        document.getElementById('modal-conteudo').innerHTML = html;
      });
    }

    function fecharModal() {
      document.getElementById('modal-cliente').style.display = 'none';
    }
  </script>
</body>
</html>
